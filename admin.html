<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" name="viewport"/>
    <title>Admin Portal — Dogfathers Plus</title>

    <!-- Staff portal: don't index in search engines -->
    <meta name="robots" content="noindex, nofollow">

    <!-- PWA Meta Tags -->
    <meta name="description" content="Dogfathers Plus admin portal. Authorized personnel only.">
    <meta name="application-name" content="Dogfathers Plus Admin">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dogfathers Admin">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#13a4ec" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
    <meta name="msapplication-TileColor" content="#13a4ec">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="format-detection" content="telephone=no">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%2313a4ec' width='100' height='100' rx='20'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white'%3E🐕%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect fill='%2313a4ec' width='180' height='180' rx='40'/%3E%3Ctext x='90' y='125' font-size='100' text-anchor='middle' fill='white'%3E🐕%3C/text%3E%3C/svg%3E">
    
    <!-- Preconnect for performance -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="styles.css" rel="stylesheet"/>
    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }
        .fill-1 { font-variation-settings: 'FILL' 1; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* Toast animations */
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .toast-enter { animation: slideIn 0.3s ease-out; }
        .toast-exit { animation: slideOut 0.3s ease-in forwards; }
        /* Loading spinner */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        /* Dark mode transitions */
        * { transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
        /* Better touch targets */
        .touch-target { min-height: 44px; min-width: 44px; }
        
        /* Groomer Portal Glass & Gradient Styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-card {
            background: rgba(42, 47, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .groomer-gradient-bg {
            background-color: #f9f7f6;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(42, 122, 119, 0.05) 0px, transparent 50%);
        }
        .dark .groomer-gradient-bg {
            background-color: #1a1d23;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.12) 0px, transparent 50%);
        }
        .soft-lift {
            box-shadow: 0 8px 24px -8px rgba(139, 92, 246, 0.15);
            transition: all 0.3s ease;
        }
        .soft-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -6px rgba(139, 92, 246, 0.22);
        }
        
        /* Mobile Modal Animations */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out both; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out both; }
        .animate-delay-100 { animation-delay: 0.1s; }
        .animate-delay-200 { animation-delay: 0.2s; }
        .animate-delay-300 { animation-delay: 0.3s; }
        .animate-delay-400 { animation-delay: 0.4s; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .skeleton { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite; border-radius: 8px; }
        .dark .skeleton { background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%); background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite; }
        .animate-scale-up { animation: scaleUp 0.2s ease-out; }
        
        /* Mobile Touch Feedback */
        @media (hover: none) {
            .soft-lift:hover { transform: none; }
            .soft-lift:active { transform: scale(0.98); }
        }
        
        /* PWA & Mobile Optimizations */
        html, body { 
            overscroll-behavior-y: contain; /* Prevent pull-to-refresh */
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight */
            -webkit-touch-callout: none; /* Disable callout on long press */
        }
        
        /* Safe area insets for notched devices */
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .safe-left { padding-left: env(safe-area-inset-left); }
        .safe-right { padding-right: env(safe-area-inset-right); }
        
        /* PWA standalone mode adjustments */
        @media (display-mode: standalone) {
            .pwa-hide { display: none !important; }
            body { padding-top: env(safe-area-inset-top); }
        }
        
        /* Prevent text selection on UI elements */
        button, .no-select { 
            -webkit-user-select: none; 
            user-select: none; 
        }
        
        /* Smooth scrolling for iOS */
        .scroll-smooth { 
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
        }
        
        /* Active state for touch feedback */
        button:active, .touch-active:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        
        /* Fix for iOS input zoom */
        @media screen and (max-width: 768px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }
        
        /* Pull to refresh indicator (optional) */
        .pull-indicator {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(-100%);
            transition: transform 0.2s;
            z-index: 9999;
        }
        .pull-indicator.visible {
            transform: translateX(-50%) translateY(20px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main-light dark:text-text-main-dark min-h-screen">
    <div id="app"></div>
    <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 safe-right"></div>
    <div id="confirm-modal"></div>
    <div id="loading-overlay" class="hidden fixed inset-0 z-[200] bg-black/50 flex items-center justify-center">
        <div class="bg-white dark:bg-surface-dark rounded-2xl p-8 flex flex-col items-center gap-4 shadow-2xl">
            <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full spinner"></div>
            <p class="text-sm font-medium text-text-sub-light dark:text-text-sub-dark">Loading...</p>
        </div>
    </div>
    <!-- Portal flag: admin staff entry. Rejects non-admin logins. -->
    <script>window.__PORTAL = 'admin';</script>
    <!-- Dogfathers Plus Application Scripts -->
    <!-- Load order: shared → auth → customer → admin → groomer → app -->
    <script src="js/shared.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/customer.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/groomer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
